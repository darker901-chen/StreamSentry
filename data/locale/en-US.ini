FilterName="StreamSentry"
Enable="Enable"
Mode="Masking mode"
ModeBlocklist="Blocklist - mask listed windows"
ModeAllowlist="Allowlist - mask unapproved content-bearing windows"
Blocklist="Blocklist (one process name or window-title substring per line)"
BlocklistHint="Windows matching any line are masked with a privacy plate. Matching is case-insensitive against the process name or the window title. Leave empty to use the built-in defaults (password managers and credential dialogs)."
Allowlist="Allowlist (one process name or window-title substring per line)"
AllowlistHint="Only content-bearing windows matching a line are approved; other application windows and the taskbar are masked with a privacy plate. Matching is case-insensitive against the process name or the window title. An empty allowlist approves no content-bearing windows. Deterministic non-content exclusions, including desktop wallpaper hosts, remain visible. Notification and password-field masking stay active regardless."
PanicHotkey="StreamSentry: mask everything (panic)"
PickerWindow="Open windows"
PickerWindowHint="Currently visible windows as 'process - title'. Pick one, then press Add."
PickerRefresh="Refresh list"
PickerRefreshHint="Re-scan the windows that are open right now."
PickerAdd="Add to list"
PickerAddHint="Append the selected window's process name to whichever list the current masking mode uses. Duplicates are not added twice."
